<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tincho · Brandkit v1.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:ital,wght@0,400;0,500;1,400&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:ital,wght@0,400;0,500;1,400&family=DM+Serif+Display:ital@0;1&family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* Tincho Brandkit — base styles */
:root {
  --ink: #15201c;
  --paper: #f4efe6;
  --paper-2: #ebe3d4;
  --lago: #1f4d4a;
  --lago-deep: #0f2e2c;
  --tierra: #b4643f;
  --tierra-soft: #d98a5c;
  --amanecer: #e4b363;
  --bruma: #8a9a95;
  --line: rgba(21,32,28,0.14);
  --line-strong: rgba(21,32,28,0.32);
  --font-display: "Instrument Serif", "Newsreader", Georgia, serif;
  --font-body: "Geist", -apple-system, system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-body);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "ss01", "cv11";
  line-height: 1.5;
}

.page {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 48px;
}

.serif { font-family: var(--font-display); font-weight: 400; letter-spacing: -0.01em; }
.mono  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.sans  { font-family: var(--font-body); }

.section {
  padding: 120px 0;
  border-top: 1px solid var(--line);
  position: relative;
}
.section:first-of-type { border-top: 0; }

.sec-head {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 48px;
  align-items: baseline;
  margin-bottom: 64px;
}
.sec-num {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink);
  opacity: 0.55;
}
.sec-title {
  font-family: var(--font-display);
  font-size: clamp(44px, 5.2vw, 76px);
  line-height: 0.98;
  letter-spacing: -0.02em;
  margin: 0;
  font-style: italic;
  font-weight: 400;
}
.sec-title em { font-style: normal; color: var(--lago); }
.sec-desc {
  max-width: 44ch;
  font-size: 15px;
  line-height: 1.55;
  color: var(--ink);
  opacity: 0.78;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.6;
}

.hero {
  min-height: 92vh;
  padding: 48px 0 80px;
  display: grid;
  grid-template-rows: auto 1fr auto;
  position: relative;
  overflow: hidden;
}
.hero-top {
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.12em;
  text-transform: uppercase; opacity: 0.75;
}
.hero-main {
  display: grid; grid-template-columns: 1.1fr 1fr; gap: 64px; align-items: end;
  padding: 120px 0 0;
}
.hero-title {
  font-family: var(--font-display);
  font-size: clamp(72px, 10vw, 164px);
  line-height: 0.86;
  letter-spacing: -0.035em;
  margin: 0;
  font-weight: 400;
}
.hero-title .italic { font-style: italic; color: var(--lago); }
.hero-meta { padding-bottom: 12px; }
.hero-meta p {
  font-size: 17px; line-height: 1.45; max-width: 38ch;
  color: var(--ink); margin: 0 0 24px;
}
.hero-bottom {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px;
  padding-top: 64px; border-top: 1px solid var(--line);
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero-bottom div span { display: block; opacity: 0.55; margin-bottom: 6px; }

.card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 24px;
}

.swatch-grid {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 16px;
}
.swatch {
  grid-column: span 3;
  aspect-ratio: 3 / 4;
  border-radius: 2px;
  padding: 18px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative;
  border: 1px solid var(--line);
  overflow: hidden;
}
.swatch.large { grid-column: span 6; aspect-ratio: 3/2; }
.swatch .role {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  opacity: 0.85;
}
.swatch .name {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 32px;
  letter-spacing: -0.02em;
  line-height: 1;
}
.swatch .codes {
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.55;
  letter-spacing: 0.02em;
}
.swatch .codes span { display: block; opacity: 0.8; }
.swatch.dark { color: var(--paper); }
.swatch.light { color: var(--ink); }

.type-spec {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 48px;
  padding: 48px 0;
  border-top: 1px solid var(--line);
}
.type-spec:last-child { border-bottom: 1px solid var(--line); }
.type-spec .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1.8; }
.type-spec .meta strong { display: block; font-size: 13px; color: var(--lago); margin-bottom: 4px; }
.type-spec .demo { min-width: 0; }

.logo-stage {
  background: var(--paper-2);
  border: 1px solid var(--line);
  border-radius: 2px;
  display: grid; place-items: center;
  aspect-ratio: 1;
  padding: 24px;
  position: relative;
}
.logo-stage.dark { background: var(--lago-deep); border-color: transparent; }
.logo-stage .tag {
  position: absolute; top: 16px; left: 16px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  opacity: 0.6;
}

.rule-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
.rule {
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: 24px;
  background: #fff;
  position: relative;
  min-height: 260px;
  display: flex; flex-direction: column;
}
.rule .badge {
  position: absolute; top: 16px; right: 16px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px;
}
.rule.do .badge { background: var(--lago); color: var(--paper); }
.rule.dont .badge { background: var(--ink); color: var(--paper); opacity: 0.9; }
.rule .label { margin-top: auto; font-size: 13px; line-height: 1.5; padding-top: 16px; border-top: 1px solid var(--line); }

.tweaks-panel {
  position: fixed; bottom: 20px; right: 20px; z-index: 9999;
  background: var(--ink); color: var(--paper);
  border-radius: 8px; padding: 16px;
  width: 280px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  font-family: var(--font-body); font-size: 13px;
}
.tweaks-panel h4 { margin: 0 0 12px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; }
.tweaks-panel .row { margin-bottom: 12px; }
.tweaks-panel label { display: block; font-size: 11px; opacity: 0.7; margin-bottom: 6px; font-family: var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; }
.tweaks-panel select {
  width: 100%; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  color: var(--paper); border-radius: 4px; padding: 6px 8px; font-family: var(--font-body);
}
.tweaks-panel .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.tweaks-panel .chip {
  padding: 6px 10px; border-radius: 999px; cursor: pointer;
  background: rgba(255,255,255,0.08); border: 1px solid transparent; font-size: 11px;
  font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase;
}
.tweaks-panel .chip.active { background: var(--lago); border-color: var(--amanecer); }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

.caption {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  opacity: 0.6;
  margin-top: 12px;
}

.quote {
  font-family: var(--font-display);
  font-style: italic;
  font-size: clamp(32px, 3.6vw, 52px);
  line-height: 1.15;
  letter-spacing: -0.015em;
  max-width: 22ch;
}

.footer {
  padding: 64px 0;
  border-top: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
  opacity: 0.7;
}

.phone {
  width: 260px;
  aspect-ratio: 9 / 19.5;
  background: var(--ink);
  border-radius: 36px;
  padding: 12px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.2), 0 2px 0 rgba(255,255,255,0.1) inset;
  margin: 0 auto;
}
.phone-inner {
  width: 100%; height: 100%; border-radius: 26px; overflow: hidden;
  background: var(--paper);
  position: relative;
}

.ig-post {
  aspect-ratio: 1;
  border-radius: 2px;
  overflow: hidden;
  position: relative;
  border: 1px solid var(--line);
}

/* TOC nav */
.toc-nav {
  position: fixed; left: 24px; top: 50%; transform: translateY(-50%);
  z-index: 100; font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
  display: flex; flex-direction: column; gap: 8px;
  background: rgba(244,239,230,0.85); backdrop-filter: blur(8px);
  padding: 12px 14px; border-radius: 2px; border: 1px solid var(--line);
}
.toc-nav a {
  color: var(--ink); opacity: 0.5; text-decoration: none; font-weight: 400; transition: opacity 0.2s;
}
.toc-nav a.active { color: var(--lago); opacity: 1; font-weight: 600; }

@media (max-width: 1100px) { .toc-nav { display: none; } }
@media (max-width: 768px) {
  .page { padding: 0 24px; }
  .hero-main { grid-template-columns: 1fr; }
  .hero-bottom { grid-template-columns: repeat(2, 1fr); }
  .sec-head { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-4 { grid-template-columns: repeat(2, 1fr); }
  .swatch-grid { grid-template-columns: repeat(6, 1fr); }
  .swatch { grid-column: span 6; }
  .swatch.large { grid-column: span 6; }
  .type-spec { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">

// ─── MARKS ────────────────────────────────────────────────────────────────

const TinchoMark = ({ size = 120, color = "currentColor", accent, style }) => {
  const ac = accent || color;
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" fill="none" style={style} aria-label="Tincho mark">
      <path d="M12 68 C 32 52, 88 52, 108 68" stroke={color} strokeWidth="4" strokeLinecap="round" fill="none"/>
      <path d="M60 30 L60 98" stroke={color} strokeWidth="4" strokeLinecap="round"/>
      <path d="M34 44 L86 44" stroke={color} strokeWidth="4" strokeLinecap="round"/>
      <circle cx="60" cy="44" r="3.2" fill={ac}/>
    </svg>
  );
};

const TinchoMonogram = ({ size = 120, color = "currentColor", bg = "transparent", accent, style }) => {
  const ac = accent || color;
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" fill="none" style={style} aria-label="Tincho monogram">
      <circle cx="60" cy="60" r="56" fill={bg} stroke={color} strokeWidth="2"/>
      <path d="M22 70 C 38 58, 82 58, 98 70" stroke={color} strokeWidth="3.5" strokeLinecap="round" fill="none"/>
      <path d="M60 36 L60 92" stroke={color} strokeWidth="3.5" strokeLinecap="round"/>
      <path d="M40 48 L80 48" stroke={color} strokeWidth="3.5" strokeLinecap="round"/>
      <circle cx="60" cy="48" r="2.8" fill={ac}/>
    </svg>
  );
};

const TinchoWordmark = ({ color = "currentColor", size = 64, tagline, tagColor }) => (
  <div style={{ display: "inline-flex", flexDirection: "column", gap: 6, color, alignItems: "flex-start" }}>
    <div style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontWeight: 400, fontSize: size, lineHeight: 0.9, letterSpacing: "-0.04em" }}>
      tincho
    </div>
    {tagline && (
      <div style={{ fontFamily: "var(--font-mono)", fontSize: Math.max(10, size * 0.16), letterSpacing: "0.18em", textTransform: "uppercase", opacity: 0.75, color: tagColor || color }}>
        {tagline}
      </div>
    )}
  </div>
);

const TinchoLockup = ({ color = "currentColor", accent, tagline = "sistema nervioso · libertad", size = 48 }) => (
  <div style={{ display: "inline-flex", alignItems: "center", gap: 18, color }}>
    <TinchoMark size={size * 1.05} color={color} accent={accent}/>
    <div style={{ width: 1, height: size * 0.9, background: "currentColor", opacity: 0.2 }}/>
    <TinchoWordmark color={color} size={size * 0.95} tagline={tagline}/>
  </div>
);

const WaveMotif = ({ width = 400, color = "currentColor", thickness = 1.5, opacity = 1, style }) => (
  <svg width={width} height={width * 0.12} viewBox="0 0 400 48" fill="none" style={{ opacity, ...style }}>
    <path d="M0 24 C 50 8, 100 40, 150 24 S 250 8, 300 24 S 400 40, 400 24" stroke={color} strokeWidth={thickness} strokeLinecap="round" fill="none"/>
  </svg>
);

const ArcMotif = ({ size = 200, color = "currentColor", thickness = 1.5, style }) => (
  <svg width={size} height={size / 2} viewBox="0 0 200 100" fill="none" style={style}>
    <path d="M4 96 A 96 96 0 0 1 196 96" stroke={color} strokeWidth={thickness} fill="none" strokeLinecap="round"/>
  </svg>
);

// ─── PALETTES & TYPE PAIRINGS ─────────────────────────────────────────────

const PALETTES = {
  atardecer: {
    label: "Atardecer · default",
    "--ink": "#15201C", "--paper": "#F4EFE6", "--paper-2": "#EBE3D4",
    "--lago": "#1F4D4A", "--lago-deep": "#0F2E2C", "--tierra": "#B4643F",
    "--tierra-soft": "#D98A5C", "--amanecer": "#E4B363", "--bruma": "#8A9A95",
  },
  amanecer: {
    label: "Amanecer · más cálido",
    "--ink": "#1A1712", "--paper": "#F7F1E4", "--paper-2": "#EEE4CE",
    "--lago": "#2D4A3E", "--lago-deep": "#162B23", "--tierra": "#C96F3D",
    "--tierra-soft": "#E08C5E", "--amanecer": "#EDBC6A", "--bruma": "#9B9583",
  },
  bruma: {
    label: "Bruma · más frío / agua",
    "--ink": "#121A1B", "--paper": "#EEEFEA", "--paper-2": "#E0E3DB",
    "--lago": "#17403F", "--lago-deep": "#081E1F", "--tierra": "#A65A3E",
    "--tierra-soft": "#C97E5E", "--amanecer": "#D8A656", "--bruma": "#7F928E",
  },
};

const TYPE_PAIRINGS = {
  instrument_geist: { label: "Instrument · Geist", display: "'Instrument Serif', Georgia, serif", body: "'Geist', -apple-system, system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
  newsreader_inter: { label: "Newsreader · Inter Tight", display: "'Newsreader', Georgia, serif", body: "'Inter Tight', -apple-system, system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
  fraunces_geist: { label: "Fraunces · Geist", display: "'Fraunces', Georgia, serif", body: "'Geist', -apple-system, system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
  dmserif_geist: { label: "DM Serif · Geist", display: "'DM Serif Display', Georgia, serif", body: "'Geist', -apple-system, system-ui, sans-serif", mono: "'JetBrains Mono', ui-monospace, monospace" },
};

const TWEAK_DEFAULTS = { paletteVariant: "amanecer", typePairing: "instrument_geist", showTOC: true };

function applyTweaks(state) {
  const p = PALETTES[state.paletteVariant] || PALETTES.atardecer;
  Object.entries(p).forEach(([k, v]) => { if (k !== "label") document.documentElement.style.setProperty(k, v); });
  const t = TYPE_PAIRINGS[state.typePairing] || TYPE_PAIRINGS.instrument_geist;
  document.documentElement.style.setProperty("--font-display", t.display);
  document.documentElement.style.setProperty("--font-body", t.body);
  document.documentElement.style.setProperty("--font-mono", t.mono);
}

// ─── TOC ──────────────────────────────────────────────────────────────────

const TOC = () => {
  const [active, setActive] = React.useState("");
  React.useEffect(() => {
    const onScroll = () => {
      const sections = document.querySelectorAll("section[id]");
      let cur = "";
      sections.forEach(s => { if (s.getBoundingClientRect().top < 200) cur = s.id; });
      setActive(cur);
    };
    window.addEventListener("scroll", onScroll);
    onScroll();
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const items = [["essence","01 Esencia"],["logo","02 Logo"],["color","03 Paleta"],["type","04 Tipografía"],["icons","05 Iconografía"],["mood","06 Moodboard"],["apps","07 Aplicaciones"],["rules","08 Do's & Don'ts"],["voice","09 Voz"]];
  return (
    <nav className="toc-nav">
      {items.map(([id, label]) => (
        <a key={id} href={`#${id}`} className={active === id ? "active" : ""}>{label}</a>
      ))}
    </nav>
  );
};

// ─── TWEAKS PANEL ─────────────────────────────────────────────────────────

const TweaksPanel = ({ state, setState }) => (
  <div className="tweaks-panel">
    <h4>Tweaks</h4>
    <div className="row">
      <label>Paleta</label>
      <div className="chips">
        {Object.entries(PALETTES).map(([k, v]) => (
          <div key={k} className={`chip ${state.paletteVariant === k ? "active" : ""}`} onClick={() => setState({ ...state, paletteVariant: k })}>
            {v.label.split(" · ")[0]}
          </div>
        ))}
      </div>
    </div>
    <div className="row">
      <label>Tipografía</label>
      <select value={state.typePairing} onChange={e => setState({ ...state, typePairing: e.target.value })}>
        {Object.entries(TYPE_PAIRINGS).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}
      </select>
    </div>
    <div className="row">
      <label style={{ display: "flex", alignItems: "center", cursor: "pointer" }}>
        <input type="checkbox" checked={state.showTOC} onChange={e => setState({ ...state, showTOC: e.target.checked })}/>
        <span style={{ marginLeft: 6 }}>Mostrar índice lateral</span>
      </label>
    </div>
  </div>
);

// ─── HERO ─────────────────────────────────────────────────────────────────

const Hero = () => (
  <section className="hero">
    <div className="page" style={{ height: "100%", display: "grid", gridTemplateRows: "auto 1fr auto" }}>
      <div className="hero-top">
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <TinchoMark size={28} color="var(--ink)" accent="var(--tierra)"/>
          <span>tincholibre.com</span>
        </div>
        <div>Brandkit v1.0 · Abril 2026</div>
      </div>
      <div className="hero-main">
        <div>
          <h1 className="hero-title">
            Oasis<br/>
            de <span className="italic">calma</span><br/>
            en medio<br/>
            del caos.
          </h1>
        </div>
        <div className="hero-meta">
          <div className="eyebrow" style={{ marginBottom: 20 }}>— Brand System · Tincho</div>
          <p>Regulación del sistema nervioso para profesionales que viven acelerados. El puente entre tecnología milenaria y validación científica moderna.</p>
          <p style={{ fontFamily: "var(--font-display)", fontStyle: "italic", fontSize: 22, lineHeight: 1.3, opacity: 0.75, maxWidth: "28ch" }}>
            Experiencia límite → libertad interna → método real.
          </p>
        </div>
      </div>
      <div className="hero-bottom">
        <div><span>Fundador</span>Tincho · Autor, Libertad en Jaque</div>
        <div><span>Audiencia</span>Profesionales LatAm, 25–45</div>
        <div><span>Tensión</span>Milenaria ↔ Neurociencia</div>
        <div><span>Promesa</span>Calma funcional</div>
      </div>
      <WaveMotif width={1600} color="var(--lago)" thickness={1} opacity={0.12} style={{ position: "absolute", left: "-10%", bottom: "-5%", pointerEvents: "none" }}/>
    </div>
  </section>
);

// ─── ESSENCE ──────────────────────────────────────────────────────────────

const Essence = () => {
  const principles = [
    { n: "01", t: "Aterrizado", d: "Nada flota. Todo aterriza en síntomas concretos, en el cuerpo, en el presente." },
    { n: "02", t: "Cálido / directo", d: "Como alguien que ya pasó por ello y te dice la verdad sin rodeos." },
    { n: "03", t: "Científico sin frío", d: "Neurociencia y teoría polivagal como fundamento, no como vitrina." },
